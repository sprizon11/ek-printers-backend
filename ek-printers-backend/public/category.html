<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Category · EK PRINTERS</title>
  <link rel="stylesheet" href="ek-premium-theme.css?v=2">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f2f6f2;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:rgba(15,23,42,0.64);
      --teal:#1B9A59;
      --teal2:#39B86B;
      --border:rgba(27,154,89,0.16);
    }
    body{
      font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(57,184,107,0.12), transparent 34%),
        radial-gradient(circle at 82% 16%, rgba(96,165,250,0.12), transparent 32%),
        var(--bg);
      color:var(--ink);
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }
    body::before{
      content:'';
      position:fixed;inset:-20% auto auto -20%;
      width:65vw;height:65vw;max-width:520px;max-height:520px;pointer-events:none;z-index:-1;
      background:radial-gradient(circle, rgba(57,184,107,0.22), rgba(57,184,107,0));
      filter:blur(24px);
      animation:orbFloat 12s ease-in-out infinite alternate;
    }
    @keyframes orbFloat{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(28px,24px,0) scale(1.08)}
    }
    .wrap{max-width:1100px;margin:0 auto;padding:1rem}
    .top{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;justify-content:space-between;gap:0.8rem;
      margin-bottom:1rem;padding:0.7rem 0.1rem;
      background:rgba(242,246,242,0.86);backdrop-filter:blur(10px);
    }
    .brand{display:inline-flex;align-items:center}
    .brand img{display:block;height:44px;width:auto;max-width:min(78vw,420px);object-fit:contain}
    .back{
      display:inline-flex;align-items:center;gap:0.4rem;text-decoration:none;
      border:1px solid var(--border);background:#fff;color:var(--ink);
      padding:0.56rem 0.82rem;border-radius:10px;font-size:0.78rem;font-weight:700;
    }
    .head{margin:0.5rem 0 1rem}
    .kicker{font-size:0.68rem;letter-spacing:0.16em;color:var(--teal);font-weight:800}
    h1{font-size:clamp(1.65rem,5.5vw,2.5rem);line-height:1.02;letter-spacing:-0.03em;margin-top:0.35rem}
    .sub{margin-top:0.48rem;font-size:0.88rem;color:var(--muted);line-height:1.55;max-width:560px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.82rem}
    .item{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:0.65rem;
      display:flex;flex-direction:column;gap:0.58rem;
      box-shadow:0 10px 24px rgba(15,23,42,0.08);
      cursor:pointer;
      transition:transform .18s,border-color .18s,box-shadow .18s;
    }
    .item{opacity:0;transform:translateY(10px);animation:itemIn .45s ease forwards}
    .item:nth-child(2){animation-delay:.06s}
    .item:nth-child(3){animation-delay:.12s}
    .item:nth-child(4){animation-delay:.18s}
    .item:nth-child(5){animation-delay:.24s}
    .item:nth-child(6){animation-delay:.3s}
    @keyframes itemIn{to{opacity:1;transform:translateY(0)}}
    .item:hover{transform:translateY(-2px);border-color:rgba(27,154,89,0.35);box-shadow:0 16px 30px rgba(15,23,42,0.12)}
    .item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eef4ef}
    .item h3{font-size:0.9rem;line-height:1.2;letter-spacing:-0.01em}
    .item p{font-size:0.73rem;color:var(--muted);line-height:1.45}
    .cta{margin-top:1rem;display:flex;gap:0.65rem;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;padding:0.72rem 1.02rem;font-size:0.8rem;font-weight:700}
    .btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}
    .btn-muted{background:#fff;border:1px solid var(--border);color:var(--ink)}

    .modal-backdrop{
      position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.56);
      display:none;align-items:center;justify-content:center;padding:1rem;
      backdrop-filter:blur(4px);
    }
    .modal-backdrop.open{display:flex}
    .modal{
      width:min(100%,760px);max-height:90vh;overflow:auto;
      background:#fff;border-radius:20px;border:1px solid rgba(27,154,89,0.18);
      box-shadow:0 36px 80px rgba(0,0,0,0.28);
      animation:modalIn .28s ease;
    }
    @keyframes modalIn{
      from{opacity:0;transform:translateY(12px) scale(.98)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:0.8rem;padding:1rem 1rem 0.6rem}
    .modal-title{font-size:1.35rem;font-weight:900;letter-spacing:-0.02em}
    .modal-close{
      border:1px solid var(--border);background:#fff;color:var(--ink);
      border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:1.1rem;
    }
    .modal-body{padding:0 1rem 1rem}
    .modal-image-wrap{
      background:linear-gradient(145deg,#f4f7f3 0%,#eaf2eb 100%);
      border:1px solid rgba(27,154,89,0.12);
      border-radius:14px;padding:0.6rem;text-align:center;
    }
    .modal-image{width:100%;max-height:min(62vh,420px);object-fit:contain;border-radius:10px}
    .modal-foot{
      border-top:1px solid rgba(15,23,42,0.08);
      padding:0.9rem 1rem 1rem;display:flex;flex-direction:column;gap:0.72rem;
    }
    .qty{
      width:100%;background:#f5faf6;border:1.5px solid var(--border);border-radius:11px;
      padding:0.82rem 0.9rem;font-size:0.84rem;font-family:inherit;outline:none;color:var(--ink)
    }
    .qty:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(27,154,89,0.12);background:#fff}
    .modal-actions{display:flex;gap:0.65rem;flex-wrap:wrap}
    .send-btn{
      flex:1;background:linear-gradient(135deg,var(--teal),var(--teal2));
      color:#fff;border:0;border-radius:11px;padding:0.84rem 1rem;
      font-size:0.84rem;font-weight:800;cursor:pointer
    }
    .wa-btn{
      display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
      border:1px solid var(--border);border-radius:11px;padding:0.84rem 1rem;
      background:#fff;color:var(--ink);font-size:0.84rem;font-weight:700
    }
    @media (min-width:860px){
      .wrap{padding:1.4rem}
      .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
    }

    /* AETHER-STYLE PREMIUM OVERRIDES */
    :root{
      --bg:#060709;
      --card:#11151b;
      --ink:#f5f7fb;
      --muted:rgba(233,239,255,0.68);
      --teal:#c7ff00;
      --teal2:#9fd800;
      --border:rgba(255,255,255,0.12);
    }
    body{
      background:radial-gradient(circle at 16% -8%, #1a2232 0%, #060709 48%, #050608 100%);
      color:var(--ink);
    }
    body::before{display:none}
    .wrap{width:min(94%,980px);padding:0.8rem 0.15rem 1.4rem}
    .top{
      position:fixed;
      top:0.8rem;
      left:50%;
      transform:translateX(-50%);
      width:min(94%,980px);
      margin:0;
      padding:0.62rem 0.8rem;
      border-radius:18px;
      border:none;
      background:linear-gradient(120deg,rgba(8,10,13,0.88) 0%,rgba(11,16,24,0.82) 55%,rgba(8,10,13,0.9) 100%);
      backdrop-filter:blur(14px);
      box-shadow:0 18px 44px rgba(0,0,0,0.52),0 1px 0 rgba(255,255,255,0.08) inset;
    }
    .brand img{height:30px;max-width:min(72vw,320px)}
    .back{
      background:rgba(255,255,255,0.06);
      border:none;
      color:#f6f8ff;
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
    }
    .head{margin:5.2rem 0 1rem}
    .kicker{color:#d4ff45}
    h1{color:#f6f8ff}
    .sub{color:rgba(228,233,247,0.72)}
    .item{
      background:rgba(12,16,22,0.88);
      border:none;
      box-shadow:0 16px 30px rgba(0,0,0,0.36);
    }
    .item:hover{border-color:rgba(212,255,69,0.45)}
    .item img{background:#0d131c}
    .item h3{color:#f7f9ff}
    .item p{color:rgba(228,233,247,0.62)}
    .btn-primary{
      background:linear-gradient(135deg,var(--teal),var(--teal2));
      color:#0a1201;
    }
    .btn-muted{
      background:rgba(255,255,255,0.06);
      border:none;
      color:#f6f8ff;
    }
    .modal{
      background:#0d1118;
      border:none;
    }
    .modal-title{color:#f7f9ff}
    .modal-image-wrap{
      background:rgba(255,255,255,0.04);
      border:none;
    }
    .modal-foot{border-top-color:rgba(255,255,255,0.1)}
    .qty{
      background:rgba(255,255,255,0.06);
      border:none;
      color:#f6f8ff;
    }
    .qty:focus{
      border-color:#d4ff45;
      box-shadow:0 0 0 4px rgba(212,255,69,0.15);
      background:rgba(255,255,255,0.08);
    }
    .wa-btn{
      background:rgba(255,255,255,0.06);
      border:none;
      color:#f6f8ff;
    }
    @media (min-width:860px){
      .wrap{padding-top:1rem}
      .head{margin-top:5.5rem}
    }

    /* WHITE THEME REFRESH */
    :root{
      --bg:#f4f7fc;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:rgba(15,23,42,0.62);
      --teal:#1494e8;
      --teal2:#0e76d6;
      --border:rgba(20,148,232,0.14);
    }
    body{background:linear-gradient(180deg,#f6f9ff 0%,#edf3fb 100%);color:var(--ink)}
    .top{
      background:rgba(255,255,255,0.9);
      box-shadow:0 12px 30px rgba(15,23,42,0.12);
    }
    .back,.btn-muted,.wa-btn{
      background:#eef5fd;
      color:#0f172a;
      box-shadow:none;
    }
    .kicker{color:var(--teal)}
    h1{color:var(--ink)}
    .sub,.item p{color:var(--muted)}
    .item,.modal{
      background:#fff;
      box-shadow:0 10px 24px rgba(15,23,42,0.08);
    }
    .item h3,.modal-title{color:var(--ink)}
    .item img,.modal-image-wrap{background:#eef4fb}
    .btn-primary,.send-btn{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}
    .qty{background:#f1f6fd;color:#0f172a}
    .qty:focus{
      box-shadow:0 0 0 4px rgba(20,148,232,0.15);
      border-color:var(--teal);
    }

    /* FINAL DARK BORDERLESS STYLE */
    :root{
      --bg:#03050a;
      --card:transparent;
      --ink:#f5f7ff;
      --muted:rgba(226,232,245,0.72);
      --teal:#1d9fff;
      --teal2:#1479e6;
      --border:transparent;
      --font-body:'Poppins','Inter','Segoe UI',Roboto,Arial,sans-serif;
      --font-heading:'Poppins','Inter','Segoe UI',Roboto,Arial,sans-serif;
    }
    body{background:radial-gradient(circle at 10% 0%,#10182a 0%,#04060b 52%,#03050a 100%);color:var(--ink)}
    .top{
      top:0;left:0;transform:none;width:100%;
      border:none;border-radius:0;box-shadow:none;
      background:rgba(6,10,18,0.9);
    }
    .brand img{height:30px;max-width:min(72vw,320px)}
    .back{background:transparent;color:#e8eeff;box-shadow:none}
    .kicker{color:#7ac2ff}
    h1,.item h3,.modal-title{color:#f5f7ff}
    .sub,.item p{color:var(--muted)}
    .item,.modal,.modal-image-wrap{
      background:transparent!important;
      border:none!important;
      border-radius:0!important;
      box-shadow:none!important;
    }
    .btn-primary,.send-btn{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}
    .btn-muted,.wa-btn{background:transparent;color:#e8eeff}
    .qty{background:rgba(255,255,255,0.06);color:#f5f7ff}
    .qty:focus{box-shadow:0 0 0 4px rgba(29,159,255,0.18)}

    /* Hang tags — image + quote only */
    .grid.hang-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
    .hang-card{
      display:flex;flex-direction:column;gap:0.65rem;
      background:transparent;border:none;box-shadow:none;padding:0;
      cursor:default;opacity:0;animation:itemIn .45s ease forwards;
    }
    .hang-card:nth-child(2){animation-delay:.05s}
    .hang-card:nth-child(3){animation-delay:.1s}
    .hang-card:nth-child(4){animation-delay:.15s}
    .hang-card:nth-child(5){animation-delay:.2s}
    .hang-card:nth-child(6){animation-delay:.25s}
    .hang-card:nth-child(7){animation-delay:.3s}
    .hang-card:hover{transform:none;box-shadow:none}
    .hang-card img{
      width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    }
    .hang-quote-btn{
      width:100%;border:0;border-radius:999px;padding:0.72rem 0.85rem;
      font-size:0.72rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;
      cursor:pointer;font-family:inherit;
      background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;
      transition:transform .15s ease,box-shadow .15s ease;
    }
    .hang-quote-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(29,159,255,0.28)}
    .hang-gallery-wrap .cta{display:none}
    @media (min-width:640px){
      .grid.hang-gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}
    }
    @media (min-width:900px){
      .grid.hang-gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:1.15rem}
    }
  </style>
</head>
<body>
  <div class="wrap" id="pageWrap">
    <div class="top">
      <div class="brand"><img src="ek-printers-logo.png?v=6" alt="EK PRINTERS"></div>
      <a class="back" href="index.html#products">← Back to Products</a>
    </div>

    <div class="head">
      <div class="kicker">PREMIUM COLLECTION</div>
      <h1 id="catTitle">Hang Tags</h1>
      <div class="sub" id="catSub">Select any variety to view full-size image, enter quantity, and send directly to quote form.</div>
    </div>

    <div class="grid" id="varietyGrid"></div>

    <div class="cta">
      <a class="btn btn-primary" href="index.html#contact">Go to Quote Form</a>
      <a class="btn btn-muted" href="https://wa.me/916374343375" target="_blank" rel="noopener noreferrer">WhatsApp Us</a>
    </div>
  </div>

  <div class="modal-backdrop" id="itemModal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="kicker">SELECTED ITEM</div>
          <div class="modal-title" id="mTitle">Item</div>
        </div>
        <button class="modal-close" id="mClose" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-image-wrap">
          <img class="modal-image" id="mImg" src="" alt="">
        </div>
      </div>
      <div class="modal-foot">
        <input class="qty" id="mQty" type="number" min="1" step="1" placeholder="Enter quantity (e.g. 500)">
        <div class="modal-actions">
          <button class="send-btn" id="sendQuote" type="button">Send to Quote →</button>
          <a class="wa-btn" id="sendWa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      'hang-tags': {
        title: 'Hang Tags',
        subtitle: 'Browse our hang tag samples and tap Get Quote for any style you like.',
        service: 'Hang tag',
        layout: 'gallery',
        quoteType: 'Premium Tags',
        items: [
          { name: 'Premium hang tag — TG', img: 'ht-01.png' },
          { name: 'Ribbed hang tag — ZE', img: 'ht-02.png' },
          { name: 'Foil hang tag — Don Carlos', img: 'ht-03.png' },
          { name: 'Kraft hang tag — Owl design', img: 'ht-04.png' },
          { name: 'Foil hang tag — FC', img: 'ht-05.png' },
          { name: 'Kraft hang tag — Brooklyn Boys', img: 'ht-06.png' },
          { name: 'Hang tag sample', img: 'ht-07.png' }
        ]
      },
      'printed-labels': {
        title: 'Printed Labels',
        subtitle: 'Premium printed label collection.',
        service: 'Labels',
        items: [
          { name: 'Printed Labels', img: 'lb-printed.png' },
          { name: 'Screen Printing Labels', img: 'lb-screen.png' },
          { name: 'Cotton Labels', img: 'lb-cotton.png' }
        ]
      },
      'woven-labels': {
        title: 'Woven Labels',
        subtitle: 'Browse our woven label samples and tap Get Quote for any style you like.',
        service: 'Labels',
        layout: 'gallery',
        quoteType: 'Woven Labels',
        items: [
          { name: 'Woven label — Nivaasa 3XL', img: 'wl-01.png' },
          { name: 'Woven label — Only Men\'s Fashion', img: 'wl-02.png' },
          { name: 'Woven label — 100% Cotton KJ', img: 'wl-03.png' },
          { name: 'Woven label — VIBE22 Kids Wear', img: 'wl-04.png' },
          { name: 'Woven label — JANVIKA XL', img: 'wl-05.png' },
          { name: 'Woven label sample', img: 'wl-06.png' }
        ]
      },
      'business-cards': {
        title: 'Business Cards',
        subtitle: 'Premium business card collection.',
        service: 'Business cards',
        items: [
          { name: 'Normal', img: 'bc-normal.png' },
          { name: 'Matt Lamination', img: 'bc-matt.png' },
          { name: 'Gloss Lamination', img: 'bc-gloss.png' },
          { name: 'Foil Cards', img: 'bc-foil.png' }
        ]
      }
    };

    const PREFILL_KEY = 'ekQuotePrefill';
    const CATEGORY_ALIASES = {
      'hang tags': 'hang-tags',
      'hang_tags': 'hang-tags',
      'hangtags': 'hang-tags',
      'woven labels': 'woven-labels',
      'woven_labels': 'woven-labels',
      'wovenlabels': 'woven-labels',
      'printed labels': 'printed-labels',
      'printed_labels': 'printed-labels',
      'printedlabels': 'printed-labels',
      'business cards': 'business-cards',
      'business_cards': 'business-cards',
      'businesscards': 'business-cards'
    };

    function resolveCategoryKey(raw) {
      const base = String(raw || 'hang-tags').trim().toLowerCase();
      if (CATEGORY_ALIASES[base]) return CATEGORY_ALIASES[base];
      if (CATEGORIES[base]) return base;
      const hyphenated = base.replace(/\s+/g, '-').replace(/_+/g, '-');
      if (CATEGORIES[hyphenated]) return hyphenated;
      return 'hang-tags';
    }

    const params = new URLSearchParams(window.location.search);
    const key = resolveCategoryKey(params.get('category'));
    const cat = CATEGORIES[key] || CATEGORIES['hang-tags'];

    if (params.get('category') !== key) {
      params.set('category', key);
      const nextUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, '', nextUrl);
    }
    let selectedItem = null;

    const modal = document.getElementById('itemModal');
    const mTitle = document.getElementById('mTitle');
    const mImg = document.getElementById('mImg');
    const mQty = document.getElementById('mQty');
    const sendQuoteBtn = document.getElementById('sendQuote');
    const sendWaBtn = document.getElementById('sendWa');

    function openItemModal(item) {
      selectedItem = item;
      mTitle.textContent = item.name;
      mImg.src = item.img;
      mImg.alt = item.name;
      mQty.value = '';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      sendWaBtn.href = `https://wa.me/916374343375?text=${encodeURIComponent(
        `Hi EK PRINTERS!\nI am interested in ${cat.title} - ${item.name}.\nQuantity: \nPlease share a quote and details.`
      )}`;
    }

    function closeItemModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.title = cat.title + ' · EK PRINTERS';
    document.getElementById('catTitle').textContent = cat.title;
    document.getElementById('catSub').textContent = cat.subtitle;

    function sendToQuote(item) {
      localStorage.setItem(PREFILL_KEY, JSON.stringify({
        service: cat.service,
        type: cat.quoteType || item.name,
        quantity: '',
        requirement: `${cat.title} — ${item.name}`
      }));
      window.location.href = 'index.html#contact';
    }

    const grid = document.getElementById('varietyGrid');
    const pageWrap = document.getElementById('pageWrap');
    const isGallery = cat.layout === 'gallery';

    if (isGallery) {
      pageWrap.classList.add('hang-gallery-wrap');
      grid.classList.add('hang-gallery');
      grid.innerHTML = cat.items.map(item => (
        `<article class="hang-card" data-name="${item.name}" data-img="${item.img}">
          <img src="${item.img}" alt="${item.name}" loading="lazy" decoding="async">
          <button type="button" class="hang-quote-btn">Get Quote</button>
        </article>`
      )).join('');

      grid.querySelectorAll('.hang-quote-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const card = btn.closest('.hang-card');
          sendToQuote({
            name: card.getAttribute('data-name') || 'Hang tag',
            img: card.getAttribute('data-img') || ''
          });
        });
      });
    } else {
      grid.innerHTML = cat.items.map(item => (
        `<article class="item" data-name="${item.name}" data-img="${item.img}">
          <img src="${item.img}" alt="${item.name}" loading="lazy" decoding="async">
          <h3>${item.name}</h3>
          <p>Tap to view full image and send to quote.</p>
        </article>`
      )).join('');

      grid.querySelectorAll('.item').forEach(card => {
        card.addEventListener('click', () => {
          openItemModal({
            name: card.getAttribute('data-name') || '',
            img: card.getAttribute('data-img') || ''
          });
        });
      });
    }

    sendQuoteBtn.addEventListener('click', () => {
      if (!selectedItem) return;
      const qty = (mQty.value || '').trim();
      localStorage.setItem(PREFILL_KEY, JSON.stringify({
        service: cat.service,
        type: selectedItem.name,
        quantity: qty,
        requirement: `${cat.title} (${selectedItem.name})`
      }));
      window.location.href = 'index.html#contact';
    });

    document.getElementById('mClose').addEventListener('click', closeItemModal);
    modal.addEventListener('click', e => {
      if (e.target === modal) closeItemModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeItemModal();
    });
  </script>
</body>
</html>
